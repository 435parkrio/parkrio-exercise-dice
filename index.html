const state=[{x:-20,y:-28},{x:-20,y:-28}];
const names=[...document.querySelectorAll('.panel')].map(p=>[...p.querySelectorAll('.face span')].map(e=>e.textContent.trim()));
const cube=[document.getElementById('cube0'),document.getElementById('cube1')];
function render(i){cube[i].style.transform=`rotateX(${state[i].x}deg) rotateY(${state[i].y}deg)`;}
let rolling=false;
let audioCtx, nextTick=0;
function prepareDiceSound(){
 try { const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; if(!audioCtx)audioCtx=new AC(); audioCtx.resume().catch(()=>{}); } catch(e){}
}
function diceSound(stop=false){
 try {
 if(!audioCtx||audioCtx.state!=='running')return;
 const now=audioCtx.currentTime, length=stop?0.16:0.045;
 const buffer=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*length),audioCtx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-6*i/data.length);
 const source=audioCtx.createBufferSource(), filter=audioCtx.createBiquadFilter(), gain=audioCtx.createGain();
 source.buffer=buffer;filter.type='bandpass';filter.frequency.value=stop?650:1100+Math.random()*1300;filter.Q.value=0.8;gain.gain.value=stop?0.85:0.55;
 source.connect(filter).connect(gain).connect(audioCtx.destination);source.start(now);
 } catch(e){}
}

function startRoll(){
 if(rolling)return;
 rolling=true;
 prepareDiceSound(); nextTick=0;
 const btn=document.getElementById('start'),result=document.getElementById('result');
 btn.disabled=true;result.textContent='🎲 두 주사위가 빠르게 회전하고 있습니다!';
 const targets=[Math.floor(Math.random()*6),Math.floor(Math.random()*6)];
 const orientations=[[0,0],[0,-90],[0,-180],[0,90],[-90,0],[90,0]];
 const initial=state.map(v=>({...v}));
 const ends=targets.map((face,i)=>{
   const [tx,ty]=orientations[face];
   // 현재 각도에서 앞으로 여러 바퀴 회전한 뒤 정확한 그림 면이 정면을 향하도록 정렬
   return {x:tx+360*Math.ceil((initial[i].x-tx)/360)+360*(8+i*2),
           y:ty+360*Math.ceil((initial[i].y-ty)/360)+360*(11+i*2)};
 });
 const begin=performance.now(),duration=2450;
 function frame(now){
  const t=Math.min(1,(now-begin)/duration);
  if(t<1 && now>=nextTick){diceSound();nextTick=now+45+170*t*t;}
  // 초반에는 빠르게 회전하고 마지막에 부드럽게 감속
  const eased=1-Math.pow(1-t,2.2);
  for(let i=0;i<2;i++){
   state[i].x=initial[i].x+(ends[i].x-initial[i].x)*eased;
   state[i].y=initial[i].y+(ends[i].y-initial[i].y)*eased;
   render(i);
  }
  if(t<1){requestAnimationFrame(frame);return;}
  // 각도를 정규화하여 다음 시작에도 자연스럽게 반복 회전
  for(let i=0;i<2;i++){
    state[i].x=orientations[targets[i]][0];state[i].y=orientations[targets[i]][1];
    cube[i].style.transform=`rotateX(${state[i].x}deg) rotateY(${state[i].y}deg)`;
  }
  diceSound(true);
  rolling=false;btn.disabled=false;
  result.textContent=`🎉 오늘의 운동: ${names[0][targets[0]]} + ${names[1][targets[1]]}`;
 }
 requestAnimationFrame(frame);
}
for(let i=0;i<2;i++){
 let el=document.getElementById('scene'+i),active=false,px=0,py=0;
 el.addEventListener('pointerdown',e=>{if(rolling)return;active=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!active||rolling)return;state[i].y+=(e.clientX-px)*.65;state[i].x-=(e.clientY-py)*.65;px=e.clientX;py=e.clientY;render(i)});
 el.addEventListener('pointerup',()=>active=false);el.addEventListener('pointercancel',()=>active=false);
}
</script></body></html>
